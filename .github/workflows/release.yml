name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP "define\( 'KTSS_VERSION', '\K[^']+" kadence-theme-style-sync.php)
          HEADER=$(grep -oP '^ \* Version:\s+\K\S+' kadence-theme-style-sync.php)
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$HEADER" ]; then
            echo "Tag $TAG does not match KTSS_VERSION $VERSION / Version header $HEADER"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p build/kadence-theme-style-sync
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' ./ build/kadence-theme-style-sync/
          cd build && zip -rq kadence-theme-style-sync.zip kadence-theme-style-sync

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/kadence-theme-style-sync.zip \
            --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
