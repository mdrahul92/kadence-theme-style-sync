name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP "define\( 'KTSS_VERSION', '\K[^']+" kadence-theme-style-sync.php)
          HEADER=$(grep -oP '^ \* Version:\s+\K\S+' kadence-theme-style-sync.php)
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$HEADER" ]; then
            echo "Tag $TAG does not match KTSS_VERSION $VERSION / Version header $HEADER"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p build/kadence-theme-style-sync
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude 'notes.md' ./ build/kadence-theme-style-sync/
          cd build && zip -rq kadence-theme-style-sync.zip kadence-theme-style-sync

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/kadence-theme-style-sync.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
